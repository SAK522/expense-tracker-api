# Render Blueprint: creates the web service AND a PostgreSQL database, and wires them together.
# In Render: New -> Blueprint -> pick this repo.
#
# The database is named `portfolio-db` because Render allows one free Postgres database per
# workspace: other projects (e.g. document-qa-api) share it, each in its own schema.
services:
  - type: web
    name: expense-tracker-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: JWT_SECRET
        generateValue: true          # Render generates a strong random secret
      - key: DATABASE_SCHEMA
        value: expense               # this app's tables live in the "expense" schema
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString

databases:
  - name: portfolio-db
    plan: free
